<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Astalia Trailer</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe, #msg { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #msg {
    display: flex; align-items: center; justify-content: center;
    color: #888; font: 500 18px/1.5 system-ui, sans-serif; text-align: center;
  }
</style>
</head>
<body>
<div id="msg">No trailer selected.</div>
<script>
  // Astalia trailer helper.
  //
  // An LG webOS app is served from file://, which has no web address, so
  // YouTube refuses to start its player there ("Error 153 - video player
  // configuration error"). This page exists only to give that embed a real
  // https address: the TV app loads THIS page in an iframe, and this page
  // loads the YouTube embed. Nothing else happens here - no tracking, no
  // data, no dependencies.
  //
  // Usage:  https://<your-pages-site>/?v=<youtube-video-id>
  (function () {
    var id = new URLSearchParams(location.search).get('v') || '';
    if (!/^[A-Za-z0-9_-]{11}$/.test(id)) return;
    var f = document.createElement('iframe');
    f.allow = 'autoplay; encrypted-media; fullscreen';
    f.allowFullscreen = true;
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.src = 'https://www.youtube.com/embed/' + id +
            '?autoplay=1&rel=0&modestbranding=1&playsinline=1&origin=' +
            encodeURIComponent(location.origin);
    document.getElementById('msg').remove();
    document.body.appendChild(f);
  })();
</script>
</body>
</html>
